embeddings_model: "sentence-transformers/all-MiniLM-L6-v2"   # small, fast, good enough
embeddings_revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"  # pinned HF commit (M3)
clustering:
  algorithm: "dbscan"       # or "kmeans"; dbscan handles variant-merging well
  min_cluster_size: 2
  eps: 0.12                 # cosine distance (similarity >= 0.88). Chosen from the measured
                            # sensitivity table in data/processed/skill_map/clusters_<date>.md
normalization:              # M3 candidate terms must appear in >= this many postings and employers
  min_postings: 3
  min_boards: 3
classifier:
  base_model: "distilbert-base-uncased"   # light enough for Colab free GPU
  base_model_revision: "12040accade4e8a0f71eabdb258fecc2e7e948be"  # pinned HF commit (M5)
  baseline: "tfidf_logreg"                 # always compare fine-tuned vs this
  test_size: 0.2
  val_size: 0.1
  max_length: 256           # tokens; 512 costs ~8x per step on this CPU (measured 82 s vs 10 s)
  epochs: 4                 # max; early stopping on validation macro-F1
  patience: 1
  learning_rate: 5.0e-5
  batch_size: 8
  seed: 42
allow_synthetic: false      # hard gate. must stay false.
trends:                     # M4. A trend needs real accumulated snapshots; nothing is backfilled.
  min_snapshots: 2          # fewer real snapshot days -> "insufficient_history"
  flow_min_days: 14         # flow (new-posting) significance test needs a window this long...
  flow_min_new_per_half: 30 # ...and at least this many new postings in each half
  min_postings: 10          # skills with fewer postings are not ranked / tested
  fdr_q: 0.05               # Benjamini-Hochberg false discovery rate
  top_k: 10
  min_city_postings: 50     # cities with fewer in-region postings get no separate scope
