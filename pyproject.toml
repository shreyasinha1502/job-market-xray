[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-xray"
version = "0.1.0"
description = "Real-data NLP tracker of rising/falling tech-skill demand from live job postings."
requires-python = ">=3.11"

[project.scripts]
xray = "xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/xray/classify/card.py" = ["E501"]  # Markdown template lines
